data:
  format: zarr
  frequency: 6h
  datasets:
    era5:
      forcing:
      - cos_latitude
      - cos_longitude
      - sin_latitude
      - sin_longitude
      - cos_julian_day
      - cos_local_time
      - sin_julian_day
      - sin_local_time
      - insolation
      - lsm
      - sdor
      - slor
      - z
      diagnostic:
      - tp
      - cp
      processors:
        normalizer:
          _target_: anemoi.models.preprocessing.normalizer.InputNormalizer
          config:
            default: mean-std
            std:
            - cp
            - tp
            min-max: null
            max:
            - sdor
            - slor
            - z
            none:
            - cos_latitude
            - cos_longitude
            - sin_latitude
            - sin_longitude
            - cos_julian_day
            - cos_local_time
            - sin_julian_day
            - sin_local_time
            - insolation
            - lsm
    surface:
      forcing:
      - cos_latitude
      - cos_longitude
      - sin_latitude
      - sin_longitude
      - cos_julian_day
      - cos_local_time
      - sin_julian_day
      - sin_local_time
      - stalt
      - lsm
      - cos_sza
      diagnostic:
      - obsvalue_t2m_0
      - obsvalue_u10m_0
      - obsvalue_v10m_0
      - obsvalue_ps_0
      - obsvalue_pmsl_0
      processors:
        const_imputer:
          _target_: anemoi.models.preprocessing.imputer.InputImputer
          config:
            default: mean
        normalizer:
          _target_: anemoi.models.preprocessing.normalizer.InputNormalizer
          config:
            default: mean-std
            std: null
            min-max: null
            max: null
            none:
            - cos_latitude
            - cos_longitude
            - sin_latitude
            - sin_longitude
            - cos_julian_day
            - cos_local_time
            - sin_julian_day
            - sin_local_time
            - lsm
            - cos_sza
  num_features: null
dataloader:
  prefetch_factor: 2
  pin_memory: true
  read_group_size: ${system.hardware.num_gpus_per_model}
  num_workers:
    training: 4
    validation: 4
    test: 4
  batch_size:
    training: 2
    validation: 2
    test: 1
  limit_batches:
    training: null
    validation: null
    test: 20
  training:
    datasets:
      era5:
        dataset_config:
          dataset: ${system.input.era5}
          frequency: ${data.frequency}
          drop:
          - cdww
          - cos_mwd
          - sin_mwd
          - ro
          - ssrd
          - strd
          - sf
          - h1012
          - h1214
          - h1417
          - h1721
          - h2125
          - h2530
          - hcc
          - mcc
          - lcc
          - mwp
          - sf
          - sd
          - skt
          - snowc
          - stl1
          - stl2
          - swh
          - swvl1
          - swvl2
          - wmb
        start: 1985
        end: 2023
        trajectory: null
      surface:
        dataset_config:
          dataset: ${system.input.surface}
          frequency: ${data.frequency}
          drop:
          - obsvalue_td2m_0
          - grid_index_o1280
          - distance
          - reportype
          - z
          window: (-1h,0]
        start: 1985
        end: 2023
        trajectory: null
  validation:
    datasets:
      era5:
        dataset_config:
          dataset: ${system.input.era5}
          frequency: ${data.frequency}
          drop:
          - cdww
          - cos_mwd
          - sin_mwd
          - ro
          - ssrd
          - strd
          - sf
          - h1012
          - h1214
          - h1417
          - h1721
          - h2125
          - h2530
          - hcc
          - mcc
          - lcc
          - mwp
          - sf
          - sd
          - skt
          - snowc
          - stl1
          - stl2
          - swh
          - swvl1
          - swvl2
          - wmb
        start: 2024
        end: 2024
        trajectory: null
      surface:
        dataset_config:
          dataset: ${system.input.surface}
          frequency: ${data.frequency}
          drop:
          - obsvalue_td2m_0
          - grid_index_o1280
          - distance
          - reportype
          - z
          window: (-1h,0]
        start: 2024
        end: 2024
        trajectory: null
  test:
    datasets:
      era5:
        dataset_config:
          dataset: ${system.input.era5}
          frequency: ${data.frequency}
          drop:
          - cdww
          - cos_mwd
          - sin_mwd
          - ro
          - ssrd
          - strd
          - sf
          - h1012
          - h1214
          - h1417
          - h1721
          - h2125
          - h2530
          - hcc
          - mcc
          - lcc
          - mwp
          - sf
          - sd
          - skt
          - snowc
          - stl1
          - stl2
          - swh
          - swvl1
          - swvl2
          - wmb
        start: 2025
        end: 2025
        trajectory: null
      surface:
        dataset_config:
          dataset: ${system.input.surface}
          frequency: ${data.frequency}
          drop:
          - obsvalue_td2m_0
          - grid_index_o1280
          - distance
          - reportype
          - z
          window: (-1h,0]
        start: 2025
        end: 2025
        trajectory: null
diagnostics:
  plot:
    settings:
      asynchronous: true
      datashader: true
      projection_kind: equirectangular
      precip_and_related_fields: []
      colormaps:
        default:
          _target_: anemoi.training.utils.custom_colormaps.MatplotlibColormap
          name: viridis
        error:
          _target_: anemoi.training.utils.custom_colormaps.MatplotlibColormap
          name: bwr
        precip:
          _target_: anemoi.training.utils.custom_colormaps.MatplotlibColormapClevels
          clevels:
          - '#ffffff'
          - '#04e9e7'
          - '#019ff4'
          - '#0300f4'
          - '#02fd02'
          - '#01c501'
          - '#008e00'
          - '#fdf802'
          - '#e5bc00'
          - '#fd9500'
          - '#fd0000'
          - '#d40000'
          - '#bc0000'
          - '#f800fd'
          variables: ${diagnostics.plot.settings.precip_and_related_fields}
    frequency:
      batch: 5
      epoch: 1
    parameters: []
    sample_idx: 0
    datasets_to_plot:
    - era5
    - surface
    focus_areas: {}
    callbacks:
    - _target_: anemoi.training.diagnostics.callbacks.plot.LossCurvePlot
      dataset_names: ${diagnostics.plot.datasets_to_plot}
      parameter_groups:
        moisture:
        - tp
        - cp
        - tcw
        - obsvalue_tp
        sfc_wind_era:
        - 10u
        - 10v
        sfc_wind_obs:
        - obsvalue_u10m_0
        - obsvalue_v10m_0
      every_n_batches: ${diagnostics.plot.frequency.batch}
      plot_fn:
        _target_: anemoi.training.diagnostics.evaluation.plotting.loss.loss_plot_fn
        _partial_: true
    - _target_: anemoi.training.diagnostics.callbacks.plot.BatchOutputPlot
      tag_infix: sample
      dataset_names:
      - era5
      sample_idx: ${diagnostics.plot.sample_idx}
      parameters:
      - t_850
      - z_500
      - u_200
      - v_200
      every_n_batches: ${diagnostics.plot.frequency.batch}
      with_auxiliary: true
      plot_fn:
        _target_: anemoi.training.diagnostics.evaluation.plotting.batch_output.sample_plot_fn
        _partial_: true
        per_sample: 6
        accumulation_levels_plot:
        - 0
        - 0.05
        - 0.1
        - 0.25
        - 0.5
        - 1
        - 1.5
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
        - 100
    - _target_: anemoi.training.diagnostics.callbacks.plot.BatchOutputPlot
      tag_infix: histo
      dataset_names:
      - era5
      sample_idx: ${diagnostics.plot.sample_idx}
      every_n_batches: ${diagnostics.plot.frequency.batch}
      parameters:
      - z_500
      - tp
      - 2t
      - 10u
      - 10v
      plot_fn:
        _target_: anemoi.training.diagnostics.evaluation.plotting.batch_output.histogram_plot_fn
        _partial_: true
        per_sample: 6
        accumulation_levels_plot:
        - 0
        - 0.05
        - 0.1
        - 0.25
        - 0.5
        - 1
        - 1.5
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
        - 100
    - _target_: anemoi.training.diagnostics.callbacks.plot.BatchOutputPlot
      tag_infix: sample
      dataset_names:
      - surface
      sample_idx: ${diagnostics.plot.sample_idx}
      parameters:
      - obsvalue_t2m_0
      - obsvalue_u10m_0
      - obsvalue_v10m_0
      - obsvalue_ps_0
      - obsvalue_pmsl_0
      every_n_batches: ${diagnostics.plot.frequency.batch}
      plot_fn:
        _target_: anemoi.training.diagnostics.evaluation.plotting.batch_output.sample_plot_fn
        _partial_: true
  callbacks: []
  benchmark_profiler:
    memory:
      enabled: true
      steps: 5
      warmup: 20
      extra_plots: false
      trace_rank0_only: false
    time:
      enabled: false
      verbose: false
    speed:
      enabled: true
    system:
      enabled: false
    model_summary:
      enabled: false
    snapshot:
      enabled: false
      steps: 4
      warmup: 0
  log:
    mlflow:
      enabled: true
      _target_: anemoi.training.diagnostics.mlflow.logger.AnemoiMLflowLogger
      offline: true
      authentication: true
      tracking_uri: https://mlflow.ecmwf.int
      experiment_name: anemobs
      project_name: AIFS
      system: false
      terminal: true
      run_name: era5-with-diagnostic-surface-reweighted
      prefix: ''
      log_hyperparams: true
      on_resume_create_child: true
      expand_hyperparams:
      - config
      http_max_retries: 35
      max_params_length: 2500
      save_dir: ${system.output.logs.mlflow}
      log_model: false
    interval: 100
    wandb:
      entity: a
  debug:
    anomaly_detection: false
  enable_checkpointing: true
  checkpoint:
    every_n_minutes:
      save_frequency: null
      num_models_saved: 0
    every_n_epochs:
      save_frequency: 1
      num_models_saved: -1
    every_n_train_steps:
      save_frequency: null
      num_models_saved: 0
  enable_progress_bar: true
  progress_bar:
    _target_: pytorch_lightning.callbacks.TQDMProgressBar
    refresh_rate: 1
  check_val_every_n_epoch: 1
  print_memory_summary: false
system:
  output:
    root: ${oc.env:SCRATCH}/cherri-dop/output
    logs:
      root: logs
      wandb: wandb
      mlflow: mlflow
      tensorboard: tensorboard
    checkpoints:
      root: checkpoint
      every_n_epochs: anemoi-by_epoch-epoch_{epoch:03d}-step_{step:06d}
      every_n_train_steps: anemoi-by_step-epoch_{epoch:03d}-step_{step:06d}
      every_n_minutes: anemoi-by_time-epoch_{epoch:03d}-step_{step:06d}
    plots: plots
    profiler: profiler
  input:
    era5: /pfs/lustrep4/scratch/project_465000451/ai-ml/datasets/aifs-ea-an-oper-0001-mars-n320-1979-2024-6h-v1-for-single-v2.zarr
    surface: /pfs/lustrep4/scratch/project_465000451/ai-ml/datasets/dop-ea-ofb-0001-1979-2025-v4-combined-surface-observations.zarr
    loss_matrices_path: null
    truncation: null
    truncation_inv: null
    warm_start: null
  hardware:
    accelerator: auto
    num_gpus_per_node: ${oc.decode:${oc.env:SLURM_GPUS_PER_NODE,1}}
    num_nodes: ${oc.decode:${oc.env:SLURM_NNODES,1}}
    num_gpus_per_model: 1
graph:
  overwrite: true
  nodes:
    era5:
      node_builder:
        _target_: anemoi.graphs.nodes.AnemoiDatasetNodes
        dataset: ${dataloader.training.datasets.era5.dataset_config}
      attributes: ${graph.attributes.nodes_static}
    surface:
      node_builder:
        _target_: anemoi.graphs.nodes.AnemoiDatasetNodes
        dataset: ${dataloader.training.datasets.surface.dataset_config}
      attributes: ${graph.attributes.nodes_dynamic}
    hidden:
      node_builder:
        _target_: anemoi.graphs.nodes.TriNodes
        resolution: 6
  edges:
  - source_name: era5
    target_name: hidden
    edge_builders:
    - _target_: anemoi.graphs.edges.ReversedKNNEdges
      num_nearest_neighbours: 3
      source_mask_attr_name: null
      target_mask_attr_name: null
    attributes: ${graph.attributes.edges.era5}
  - source_name: hidden
    target_name: hidden
    edge_builders:
    - _target_: anemoi.graphs.edges.MultiScaleEdges
      x_hops: 1
      scale_resolutions: ${graph.nodes.hidden.node_builder.resolution}
      source_mask_attr_name: null
      target_mask_attr_name: null
    attributes: ${graph.attributes.edges.processor}
  - source_name: hidden
    target_name: era5
    edge_builders:
    - _target_: anemoi.graphs.edges.KNNEdges
      num_nearest_neighbours: 3
      source_mask_attr_name: null
      target_mask_attr_name: null
    attributes: ${graph.attributes.edges.era5}
  - source_name: hidden
    target_name: surface
    edge_builders:
    - _target_: anemoi.graphs.edges.KNNEdges
      num_nearest_neighbours: 4
      source_mask_attr_name: null
      target_mask_attr_name: null
    attributes: ${graph.attributes.edges.surface_decoder}
  attributes:
    nodes_static:
      area_weight:
        _target_: anemoi.graphs.nodes.attributes.SphericalAreaWeights
        norm: unit-max
        fill_value: 0
    nodes_dynamic:
      area_weight:
        _target_: anemoi.graphs.nodes.attributes.SphericalAreaWeights
        norm: unit-max
        fill_value: 0
      timedeltas:
        _target_: anemoi.graphs.nodes.attributes.Timedeltas
        scale_seconds: 3600.0
        periods:
        - 1.0
        - 0.5
        - 0.25
    edges:
      edge_length:
        _target_: anemoi.graphs.edges.attributes.EdgeLength
        norm: unit-std
      edge_dirs:
        _target_: anemoi.graphs.edges.attributes.EdgeDirection
        norm: unit-std
      dir_harmonics:
        _target_: anemoi.graphs.edges.attributes.DirectionalHarmonics
        order: 3
      processor:
        edge_length: ${graph.attributes.edges.edge_length}
        edge_dirs: ${graph.attributes.edges.edge_dirs}
        dir_harmonics: ${graph.attributes.edges.dir_harmonics}
      surface_decoder:
        edge_length: ${graph.attributes.edges.edge_length}
        edge_dirs: ${graph.attributes.edges.edge_dirs}
        dir_harmonics: ${graph.attributes.edges.dir_harmonics}
        timedeltas:
          _target_: anemoi.graphs.edges.attributes.Timedeltas
          node_axis: target
          scale_seconds: 3600.0
      era5:
        edge_length: ${graph.attributes.edges.edge_length}
        edge_dirs: ${graph.attributes.edges.edge_dirs}
  post_processors: []
model:
  num_channels: 1024
  cpu_offload: false
  keep_batch_sharded: false
  model:
    _target_: anemoi.models.models.AnemoiModelEncProcDec
    hidden_nodes_name: hidden
    latent_skip: true
  layer_kernels:
    LayerNorm:
      _target_: torch.nn.LayerNorm
    Linear:
      _target_: torch.nn.Linear
    Activation:
      _target_: torch.nn.GELU
    QueryNorm:
      _target_: anemoi.models.layers.normalization.AutocastLayerNorm
      bias: false
    KeyNorm:
      _target_: anemoi.models.layers.normalization.AutocastLayerNorm
      bias: false
  processor:
    _target_: anemoi.models.layers.processor.TransformerProcessor
    trainable_size: ${model.edge_trainable_parameters.hidden2hidden}
    sub_graph_edge_attributes: ${model.attributes.edges}
    num_channels: ${model.num_channels}
    num_layers: 16
    num_chunks: 4
    mlp_hidden_ratio: 2.67
    mlp_implementation: swiglu
    num_heads: 16
    window_size: 1120
    dropout_p: 0.0
    attention_implementation: flash_attention
    softcap: 0.0
    use_alibi_slopes: false
    qk_norm: false
    cpu_offload: ${model.cpu_offload}
    gradient_checkpointing: true
    use_rotary_embeddings: false
    layer_kernels: ${model.layer_kernels}
  encoders:
    era5:
      source_datasets:
      - era5
      dataset_fusing_strategy: none
      mapper:
        _target_: anemoi.models.layers.mapper.GraphTransformerForwardMapper
        num_channels: ${model.num_channels}
        trainable_size: ${model.edge_trainable_parameters.data2hidden}
        sub_graph_edge_attributes: ${model.attributes.edges}
        num_chunks: 4
        mlp_hidden_ratio: 2.67
        mlp_implementation: swiglu
        num_heads: 16
        qk_norm: false
        cpu_offload: ${model.cpu_offload}
        gradient_checkpointing: true
        layer_kernels: ${model.layer_kernels}
        shard_strategy: edges
        graph_attention_backend: triton
        edge_pre_mlp: false
  latent_aggregator:
    _target_: anemoi.models.layers.aggregator.SumAggregator
  decoders:
    era5:
      target_datasets:
      - era5
      target_node_features:
      - encoded_data
      mapper:
        _target_: anemoi.models.layers.mapper.GraphTransformerBackwardMapper
        num_channels: ${model.num_channels}
        trainable_size: ${model.edge_trainable_parameters.hidden2data}
        sub_graph_edge_attributes: ${model.attributes.edges}
        num_chunks: 1
        mlp_hidden_ratio: 2.67
        mlp_implementation: swiglu
        num_heads: 16
        initialise_data_extractor_zero: false
        qk_norm: false
        cpu_offload: ${model.cpu_offload}
        gradient_checkpointing: true
        layer_kernels: ${model.layer_kernels}
        shard_strategy: edges
        graph_attention_backend: triton
        edge_pre_mlp: false
    surface:
      target_datasets:
      - surface
      target_node_features:
      - coordinates
      - target_forcings
      mapper:
        _target_: anemoi.models.layers.mapper.GraphTransformerBackwardMapper
        num_channels: ${model.num_channels}
        trainable_size: ${model.edge_trainable_parameters.hidden2data}
        sub_graph_edge_attributes: ${model.attributes.edges}
        num_chunks: 1
        mlp_hidden_ratio: 2.67
        mlp_implementation: swiglu
        num_heads: 16
        initialise_data_extractor_zero: false
        qk_norm: false
        cpu_offload: ${model.cpu_offload}
        gradient_checkpointing: true
        layer_kernels: ${model.layer_kernels}
        shard_strategy: edges
        graph_attention_backend: triton
        edge_pre_mlp: false
  residual:
    datasets:
      era5:
        _target_: anemoi.models.layers.residual.SkipConnection
        step: -1
  output_mask:
    datasets: {}
  node_trainable_parameters:
    era5: 4
    hidden: 4
  edge_trainable_parameters:
    data2hidden: 4
    hidden2data: 4
    hidden2hidden: 4
  compile: []
  attributes:
    edges:
    - edge_length
    - edge_dirs
    nodes: []
  bounding:
    datasets:
      era5:
      - _target_: anemoi.models.layers.bounding.LeakyReluBounding
        variables:
        - tp
      - _target_: anemoi.models.layers.bounding.FractionBounding
        variables:
        - cp
        min_val: 0
        max_val: 1
        total_var: tp
task:
  _target_: anemoi.training.tasks.Forecaster
  multistep_input: 1
  multistep_output: 1
  timestep: 6h
  rollout:
    start: 1
    epoch_increment: 0
    maximum: 1
  validation_rollout: 1
training:
  scalers:
    datasets:
      surface:
        general_variable:
          _target_: anemoi.training.losses.scalers.GeneralVariableLossScaler
          weights:
            default: 1
            obsvalue_t2m: 5
            obsvalue_u10m: 0.5
            obsvalue_v10m: 0.5
            obsvalue_ps: 10
            obsvalue_pmsl: 20
      era5:
        general_variable:
          _target_: anemoi.training.losses.scalers.GeneralVariableLossScaler
          weights:
            default: 1
            q: 0.8
            t: 6
            u: 0.8
            v: 0.5
            w: 0.001
            z: 12
            sp: 10
            10u: 0.1
            10v: 0.1
            2d: 0.5
            tp: 0.025
            cp: 0.0025
        pressure_level:
          _target_: anemoi.training.losses.scalers.ReluVariableLevelScaler
          group: pl
          y_intercept: 0.2
          slope: 0.001
        stdev_tendency:
          _target_: anemoi.training.losses.scalers.StdevTendencyScaler
        var_tendency:
          _target_: anemoi.training.losses.scalers.VarTendencyScaler
        node_weights:
          _target_: anemoi.training.losses.scalers.GraphNodeAttributeScaler
          nodes_attribute_name: area_weight
          norm: unit-sum
        time_steps:
          _target_: anemoi.training.losses.scalers.UniformTimeStepScaler
  optimization:
    optimizer:
      _target_: torch.optim.AdamW
      betas:
      - 0.9
      - 0.95
      weight_decay: 0.1
    lr_scheduler:
      _target_: timm.scheduler.CosineLRScheduler
      lr_min: 3.0e-07
      t_initial: ${training.max_steps}
      warmup_t: 500
      t_in_epochs: false
    lr: 0.000165
    pl_lr_scheduler:
      interval: step
  run_id: null
  fork_run_id: null
  transfer_learning: false
  load_weights_only: false
  update_ds_stats_on_ckpt_load:
    states: false
    tendencies: true
  deterministic: false
  precision: bf16-mixed
  accum_grad_batches: 1
  num_sanity_val_steps: 0
  gradient_clip:
    val: 1.0
    algorithm: norm
  method:
    _target_: anemoi.training.train.methods.SingleTraining
  strategy:
    _target_: anemoi.training.distributed.strategy.DDPGroupStrategy
    num_gpus_per_model: ${system.hardware.num_gpus_per_model}
    read_group_size: ${dataloader.read_group_size}
  loss_gradient_scaling: false
  max_epochs: 100
  max_steps: 150000
  submodules_to_freeze: []
  training_loss:
    datasets:
      era5:
        _target_: anemoi.training.losses.MSELoss
        scalers:
        - pressure_level
        - general_variable
        - node_weights
        - time_steps
        ignore_nans: true
      surface:
        _target_: anemoi.training.losses.MSELoss
        scalers:
        - general_variable
        ignore_nans: true
  validation_metrics:
    datasets:
      era5:
        mse:
          _target_: anemoi.training.losses.MSELoss
          scalers:
          - node_weights
          - time_steps
          ignore_nans: true
      surface:
        mse:
          _target_: anemoi.training.losses.MSELoss
          scalers: []
          ignore_nans: true
  variable_groups:
    datasets:
      era5:
        default: sfc
        pl:
          param:
          - q
          - t
          - u
          - v
          - w
        sfc:
          param:
          - tp
          - cp
          - 10u
          - 10v
          - 2d
          - sp
      surface:
