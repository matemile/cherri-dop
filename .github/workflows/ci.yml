name: Validate cherri-dop env

on:
  push:
    branches: [main]
  pull_request:

jobs:
  install-and-import:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Create locked environment
        run: uv sync --locked --all-groups

      - name: Check imports
        run: uv run python scripts/check_install.py
